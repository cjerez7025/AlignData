# Publica el sitio en Firebase Hosting al hacer push a main.
# Requiere el secreto FIREBASE_SERVICE_ACCOUNT_ALIGNDATA_LANDING (JSON de una cuenta de servicio
# con rol "Firebase Hosting Admin"). Se puede generar con: firebase init hosting:github
name: Deploy a Firebase Hosting (live)
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Verificar enlaces, anclas y JSON-LD
        run: node scripts/check-site.mjs
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ALIGNDATA_LANDING }}
          channelId: live
          projectId: aligndata-landing
