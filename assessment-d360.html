  arco: '<svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 3L4 6.5v5c0 4.5 3.4 8.7 8 9.5 4.6-.8 8-5 8-9.5v-5L12 3z" fill="#00B894" opacity="0.2" stroke="#00B894" stroke-width="1.5" stroke-linejoin="round"/><path d="M8.5 12l2.5 2.5 4.5-4.5" stroke="#00B894" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  sec:  '<svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M16.5 10.5V6.75a4.5 4.5 0 10-9 0v3.75" stroke="#F59E0B" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/><rect x="3.75" y="10.5" width="16.5" height="11.25" rx="2.25" fill="#F59E0B" opacity="0.2" stroke="#F59E0B" stroke-width="1.5"/><circle cx="12" cy="16.125" r="1.75" fill="#F59E0B" opacity="0.9"/></svg>',
  risk: '<svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 2.25L3.75 6.75v4.5c0 5.25 3.6 10.15 8.25 11.25 4.65-1.1 8.25-6 8.25-11.25v-4.5L12 2.25z" fill="#EF4444" opacity="0.15" stroke="#EF4444" stroke-width="1.5" stroke-linejoin="round"/><path d="M12 8v4M12 14.5v.5" stroke="#EF4444" stroke-width="2" stroke-linecap="round"/></svg>',
};
const ICON_BG = { gov:'rgba(37,99,235,0.14)', data:'rgba(139,92,246,0.14)', arco:'rgba(0,184,148,0.14)', sec:'rgba(245,158,11,0.14)', risk:'rgba(239,68,68,0.14)' };

// Recomendación por dimensión: texto genérico, sin plazos ni artículos específicos.
const RECOS = {
  gov:  'Formalizar una política de protección de datos aprobada por la dirección y designar un responsable de privacidad (o un DPO) con atribuciones claras.',
  data: 'Elaborar un registro de actividades de tratamiento con los datos que recopilan, su finalidad y plazos de conservación, y publicar un aviso de privacidad conforme a la Ley 21.719.',
  arco: 'Implementar un canal formal para que sus clientes ejerzan sus derechos (acceso, rectificación, supresión, oposición y portabilidad) y responder dentro de los plazos que fija la ley.',
  sec:  'Implementar cifrado de datos sensibles, control de accesos por roles y un plan de respuesta ante brechas de seguridad con notificación a la autoridad cuando corresponda.',
  risk: 'Capacitar al equipo en los requerimientos de la Ley 21.719 e iniciar un plan de adecuación con acciones concretas antes de la entrada en vigor de la ley.',
};

let current = -1;
const answers = new Array(8).fill(null);
const $ = (id) => document.getElementById(id);

function getScore() { return Math.round((answers.reduce((s, v) => s + (v !== null ? v : 0), 0) / 24) * 100); }
function getDimScore(i) { const qs = DIMS[i].questions; return Math.round((qs.reduce((s, qi) => s + (answers[qi] !== null ? answers[qi] : 0), 0) / (qs.length * 3)) * 100); }
function getLevel(score) { return LEVELS.find(l => score >= l.min && score <= l.max) || LEVELS[0]; }

function renderIntro() {
  $('progressWrap').hidden = true;
  $('mainCard').innerHTML = `
    <div class="intro">
      <div class="intro-badge"><span style="width:6px;height:6px;border-radius:50%;background:#2fe0bb;display:inline-block"></span>Autodiagnóstico gratuito · Ley 21.719</div>
      <h1>¿Está su empresa<br>preparada para la <em>Ley 21.719?</em></h1>
      <p>Responda 8 preguntas y obtenga en unos 5 minutos su nivel de madurez referencial en protección de datos personales, con recomendaciones concretas.</p>
      <div class="intro-meta">
        <div class="intro-meta-item"><div class="intro-meta-num">8</div><div class="intro-meta-lbl">Preguntas</div></div>
        <div class="intro-meta-item"><div class="intro-meta-num">5</div><div class="intro-meta-lbl">Dimensiones</div></div>
        <div class="intro-meta-item"><div class="intro-meta-num">~5'</div><div class="intro-meta-lbl">Minutos</div></div>
      </div>
      <button class="btn-start" id="btnStart" type="button">Iniciar autodiagnóstico →</button>
      <p class="disclaimer">Resultado referencial, basado en sus respuestas. No constituye asesoría legal. Sus respuestas solo se guardan si usted solicita el diagnóstico completo.</p>
    </div>`;
  $('btnStart').addEventListener('click', () => { current = 0; renderQuestion(); });
}

function renderQuestion() {
  const q = QUESTIONS[current];
  const dim = DIMS.find(d => d.id === q.dim);
  const sel = answers[current];
  $('progressWrap').hidden = false;
  $('progressLabel').textContent = `Pregunta ${current + 1} de 8`;
  $('dimName').textContent = dim.name;
  const pct = Math.round((current / 8) * 100);
  $('progressFill').style.width = pct + '%';
  $('progressBar').setAttribute('aria-valuenow', pct);
  $('mainCard').innerHTML = `
    <div class="fade-in-r">
      <div class="dim-label"><span class="dim-dot" style="background:${dim.color}"></span>${dim.name}</div>
      <div class="q-num">Pregunta ${current + 1} de 8</div>
      <fieldset>
        <legend class="q-text" id="qText" tabindex="-1">${q.q}</legend>
        <div class="q-sub">${q.sub}</div>
        <div class="options">
          ${q.opts.map(o => `
            <label class="opt ${sel === o.v ? 'selected' : ''}">
              <input type="radio" name="q${current}" value="${o.v}" ${sel === o.v ? 'checked' : ''}>
              <span class="opt-circle"><span class="opt-check"></span></span>
              <span class="opt-content"><span class="opt-label" style="display:block">${o.l}</span><span class="opt-desc" style="display:block">${o.d}</span></span>
            </label>`).join('')}
        </div>
      </fieldset>
      <div class="nav">
        <button class="btn-back" id="btnBack" type="button" ${current === 0 ? 'style="visibility:hidden"' : ''}>← Anterior</button>
        <button class="btn-next" id="btnNext" type="button" ${sel === null ? 'disabled' : ''}>${current === 7 ? 'Ver resultados →' : 'Siguiente →'}</button>
      </div>
    </div>`;
  document.querySelectorAll('.opt input').forEach(inp => inp.addEventListener('change', () => {
    answers[current] = parseInt(inp.value, 10);
    document.querySelectorAll('.opt').forEach(o => o.classList.toggle('selected', o.contains(inp) && inp.checked));
    $('btnNext').disabled = false;
  }));
  $('btnBack').addEventListener('click', () => { if (current > 0) { current--; renderQuestion(); } });
  $('btnNext').addEventListener('click', () => {
    if (answers[current] === null) return;
    if (current < 7) { current++; renderQuestion(); } else renderResults();
  });
  $('qText').focus({ preventScroll: true });
}

function renderResults() {
  const score = getScore();
  const level = getLevel(score);
  $('progressWrap').hidden = true;

  const dimScores = DIMS.map((d, i) => ({ ...d, score: getDimScore(i) }));
  const gaps = dimScores.filter(d => d.score < 80).sort((a, b) => a.score - b.score);   // brechas reales, según sus respuestas
  const shown = gaps.slice(0, 2), locked = gaps.slice(2);

  const bars = dimScores.map(d => {
    const c = d.score < 33 ? '#EF4444' : d.score < 66 ? '#F59E0B' : d.color;
    return `<div class="dim-bar-item">
      <div class="dim-bar-top"><span class="dim-bar-name">${d.name}</span><span class="dim-bar-score">${d.score}%</span></div>
      <div class="dim-bar-track"><div class="dim-bar-fill" style="width:0%;background:${c}" data-width="${d.score}%"></div></div>
    </div>`;
  }).join('');

  const item = (d, full) => `
    <div class="reco-item ${full ? '' : 'reco-item--locked'}">
      <div class="reco-icon-wrap" style="background:${ICON_BG[d.id]}">${ICONS[d.id]}</div>
      <div><strong>${d.name} · ${d.score}%</strong>${full ? RECOS[d.id] : '🔒 El detalle y las acciones recomendadas están en el diagnóstico completo.'}</div>
    </div>`;

  const gapsHtml = gaps.length === 0
    ? `<div class="reco-item"><div class="reco-icon-wrap" style="background:rgba(0,184,148,0.14)">${ICONS.arco}</div><div><strong>Sin brechas relevantes en este autodiagnóstico</strong>Sus respuestas indican un nivel de madurez alto en las 5 dimensiones evaluadas. Un diagnóstico D360° puede profundizar en las 8 dimensiones y validar la evidencia.</div></div>`
    : shown.map(d => item(d, true)).join('') + locked.map(d => item(d, false)).join('');

  const circ = 2 * Math.PI * 46;
  $('mainCard').innerHTML = `
    <div class="result fade-in-r">
      <div class="result-header">
        <div class="score-ring">
          <svg width="120" height="120" viewBox="0 0 120 120" aria-hidden="true">
            <circle class="score-ring-bg" cx="60" cy="60" r="46"/>
            <circle class="score-ring-fill" cx="60" cy="60" r="46" stroke="${level.color}" stroke-dasharray="${circ}" stroke-dashoffset="${circ}" id="ringFill"/>
          </svg>
          <div class="score-num"><div class="score-val" id="scoreVal">0</div><div class="score-max">/ 100</div></div>
        </div>
        <h2 class="result-level" id="resultTitle" tabindex="-1">${level.name}</h2>
        <div class="result-sub">${level.desc}</div>
      </div>
      <div class="dim-bars">${bars}</div>
      <div class="recos">
        <div class="reco-title">Brechas detectadas <span class="reco-count-badge ${gaps.length ? '' : 'ok'}">${gaps.length ? gaps.length + (gaps.length === 1 ? ' brecha identificada' : ' brechas identificadas') : 'Sin brechas relevantes'}</span></div>
        ${gapsHtml}
        ${locked.length ? `<div class="blur-wall-cta"><div class="blur-wall-cta-icon" aria-hidden="true">🔍</div><div><div class="blur-wall-cta-title">${locked.length} ${locked.length === 1 ? 'brecha adicional' : 'brechas adicionales'} con detalle en el diagnóstico completo</div><div class="blur-wall-cta-sub">El diagnóstico D360° incluye el análisis detallado de cada brecha, un plan de acción priorizado y el acompañamiento de nuestro equipo.</div></div></div>` : ''}
      </div>
      <form class="lead-form" id="leadForm" novalidate>
        <div class="lead-title">Reciba el análisis completo</div>
        <div class="lead-sub">Déjenos sus datos y un experto de AlignData le enviará el detalle de sus brechas y una propuesta de plan de acción para prepararse para la Ley 21.719.</div>
        <div class="lead-fields">
          <div class="field-wrap"><label class="field-label" for="fName">Nombre *</label><input class="field-input" type="text" id="fName" placeholder="Juan Pérez" autocomplete="name" required></div>
          <div class="field-wrap"><label class="field-label" for="fCompany">Empresa</label><input class="field-input" type="text" id="fCompany" placeholder="Mi Empresa Ltda." autocomplete="organization"></div>
        </div>
        <div class="lead-fields">
          <div class="field-wrap"><label class="field-label" for="fEmail">Correo *</label><input class="field-input" type="email" id="fEmail" placeholder="juan@empresa.cl" autocomplete="email" required></div>
          <div class="field-wrap"><label class="field-label" for="fPhone">Teléfono (opcional)</label><input class="field-input" type="tel" id="fPhone" placeholder="+56 9 1234 5678" autocomplete="tel"></div>
        </div>
        <div class="hp" aria-hidden="true"><label for="fWeb">No complete este campo</label><input type="text" id="fWeb" tabindex="-1" autocomplete="off"></div>
        <label class="consent" for="fConsent"><input type="checkbox" id="fConsent" required><span>Acepto que PrivaData SpA (AlignData) trate mis datos y los resultados de este autodiagnóstico para contactarme, según su <a href="privacidad.html" target="_blank" rel="noopener">Política de privacidad</a>. *</span></label>
        <div class="form-error" id="formError" role="alert" hidden></div>
        <button class="btn-lead" id="btnLead" type="submit">Solicitar el análisis completo →</button>
        <div class="lead-privacy">Solo usaremos sus datos para contactarlo en relación con este diagnóstico.</div>
      </form>
    </div>`;

  setTimeout(() => {
    $('ringFill').style.strokeDashoffset = circ - (score / 100) * circ;
    let n = 0;
    const iv = setInterval(() => { n = Math.min(n + 2, score); $('scoreVal').textContent = n; if (n >= score) clearInterval(iv); }, 20);
    document.querySelectorAll('.dim-bar-fill').forEach(b => setTimeout(() => { b.style.width = b.dataset.width; }, 200));
  }, 100);
  $('resultTitle').focus({ preventScroll: true });
  $('leadForm').addEventListener('submit', (e) => { e.preventDefault(); submitLead(score); });
}

function submitLead(score) {
  const name = $('fName').value.trim(), company = $('fCompany').value.trim(), email = $('fEmail').value.trim(), phone = $('fPhone').value.trim();
  const err = $('formError');
  const fail = (msg, field) => { err.textContent = msg; err.hidden = false; if (field) { field.setAttribute('aria-invalid', 'true'); field.focus(); } };
  err.hidden = true;
  ['fName', 'fEmail'].forEach(id => $(id).removeAttribute('aria-invalid'));
  if (!name) return fail('Por favor ingrese su nombre.', $('fName'));
  if (!ADForms.isEmail(email)) return fail('Por favor ingrese un correo válido.', $('fEmail'));
  if (!$('fConsent').checked) return fail('Debe aceptar el tratamiento de sus datos para solicitar el análisis.', $('fConsent'));

  const btn = $('btnLead');
  btn.disabled = true; btn.textContent = 'Enviando…';
  ADForms.send({
    tipo: 'assessment', nombre: name, empresa: company, correo: email, telefono: phone,
    score: score, dims: DIMS.map((d, i) => getDimScore(i)), respuestas: answers.slice()
  }, $('fWeb').value).then(() => {
    if (window.adTrack) window.adTrack('generate_lead', { form: 'assessment', score: score });
    $('leadForm').innerHTML = `
      <div class="sent-state" role="status" tabindex="-1" id="sentState">
        <div class="sent-icon" aria-hidden="true">✅</div>
        <div class="sent-title">¡Solicitud enviada!</div>
        <div class="sent-sub">Un experto de AlignData se contactará en menos de 24 horas hábiles para coordinar su diagnóstico completo.</div>
      </div>`;
    $('sentState').focus();
  }).catch((e) => {
    btn.disabled = false; btn.textContent = 'Solicitar el análisis completo →';
    fail(ADForms.errorMessage(e));
  });
}

renderIntro();
</script>
</body>
</html>
